{{- if not .Values.secretName -}}
{{- fail "secretName is required" -}}
{{- end -}}
{{/*
The key encrypts what the service stored with it: a new key on every reconcile
would make that data unreadable. So the key in place is read back, and a new
one is minted only when there is none.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secretName -}}
{{- $key := "" -}}
{{- if and $existing $existing.data (index $existing.data .Values.key) -}}
  {{- $key = index $existing.data .Values.key | b64dec -}}
{{- else -}}
  {{- $key = randBytes 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.key }}: {{ $key | quote }}
