apiVersion: v1alpha1
name: okdp-control-plane-ui
tag: 0.7.0-p01
protected: false
description: |
  OKDP UI - Frontend web interface for the Open Kubernetes Data Platform
usage:
  text: |
    Access the console at
    https://{{ .Parameters.host | default (printf "okdp-ui.%s" .Context.ingress.suffix) }}
    The same ingress routes /api to the okdp-server Service, so the browser
    never leaves the origin and the API is never exposed on its own host.
schema:
  parameters:
    properties:
      imageRepository: { type: string, default: "quay.io/okdp/images/okdp-control-plane-ui", description: "Console image repository." }
      imageTag: { type: string, default: "0.7.0", description: "Console image tag. Set explicitly so the deployed image is pinned rather than following the chart appVersion." }
      host: { type: string, description: "Console host. Defaults to okdp-ui.<ingress suffix>." }
      oidcAuthority: { type: string, required: true, description: "Issuer the console redirects to, injected at container start rather than baked into the bundle." }
      oidcClientId: { type: string, default: "okdp-ui" }
      rolesClaim: { type: string, default: "groups", description: "Claim of the ID token carrying the caller's roles. Dotted paths are resolved. Keycloak keeps realm_access out of the ID token, hence groups." }
      adminRole: { type: string, default: "platform_admin", description: "Role that opens the administration screens." }
      backendService: { type: string, default: "okdp-control-plane-server-main", description: "In-cluster Service the ingress routes /api to. KuboCD names a Service <release>-<module>, hence the -main suffix when the server Release is named okdp-control-plane-server." }
      backendPort: { type: integer, default: 8093 }
  context:
    properties:
      ingress:
        required: true
        properties:
          suffix: { type: string, required: true }
          className: { type: string, required: true }
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            properties:
              name: { type: string, required: true }
modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/okdp-control-plane-ui
        tag: 0.7.0
    values: |
      {{- $domain := printf "%v" .Context.ingress.suffix -}}
      {{- $host := .Parameters.host | default (printf "okdp-ui.%s" $domain) -}}

      image:
        repository: {{ .Parameters.imageRepository | quote }}
        tag: {{ .Parameters.imageTag | quote }}

      backend:
        service: {{ .Parameters.backendService | quote }}
        port: {{ .Parameters.backendPort }}

      oidc:
        authority: {{ .Parameters.oidcAuthority | quote }}
        clientId: {{ .Parameters.oidcClientId | quote }}

      identity:
        rolesClaim: {{ .Parameters.rolesClaim | quote }}
        adminRole: {{ .Parameters.adminRole | quote }}

      ingress:
        className: {{ .Context.ingress.className }}
        host: {{ $host | quote }}
        clusterIssuer: {{ .Context.certificateIssuers.selfSigned.name | quote }}
        tlsSecretName: okdp-ui-tls
roles:
  - okdp-ui
dependencies:
  - okdp-server
  - ingress
