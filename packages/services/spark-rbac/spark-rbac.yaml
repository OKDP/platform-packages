apiVersion: v1alpha1
name: spark-rbac
tag: 1.0.0 # x-release-please-version
protected: false
description: |
  Helm chart that provisions the Kubernetes ServiceAccount and RBAC resources
  (Role and RoleBinding) required to run Apache Spark on Kubernetes.
usage:
  text: |
    Helm chart that provisions the Kubernetes ServiceAccount and RBAC resources
    (Role and RoleBinding) required to run Apache Spark on Kubernetes.
schema:
  parameters:
    properties:
      rbacCreate: { title: "RBAC | Create role | | order:1", type: boolean, default: true }
      serviceAccountCreate: { title: "RBAC | Create service account | | order:2", type: boolean, default: true }
      serviceAccountName: { title: "RBAC | Service account name | | order:3 columns:2", type: string, default: spark }
      automountServiceAccountToken: { title: "RBAC | Automount token | | order:4 advanced:true", type: boolean, default: true }
modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/spark-rbac
        tag: 1.0.1
    values: |
      rbac:
        create: {{ .Parameters.rbacCreate }}
      serviceAccount:
        create: {{ .Parameters.serviceAccountCreate }}
        name: "{{ .Parameters.serviceAccountName }}"
        automount: {{ .Parameters.automountServiceAccountToken }}

roles:
  - spark-rbac