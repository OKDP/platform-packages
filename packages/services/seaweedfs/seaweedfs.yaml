# SeaweedFS storage ADAPTER (ADR-0001).
apiVersion: v1alpha1
name: seaweedfs
tag: 4.17.0-p6
protected: false
description: |
  SeaweedFS is a simple and highly scalable distributed file system. There are the objectives to store billions of files and to serve the files fast!
usage:
  text: |
    SeaweedFS is a simple and highly scalable distributed file system.
    Access the console at {{ .Context.defaultStorage.provider.endpoints.consoleUrl 
       | replace "{{ .Release.namespace }}" .Release.spec.targetNamespace 
       | replace "{{ .Release.metadata.name }}" .Release.metadata.name 
       | replace "{{ .Context.ingress.suffix }}" .Context.platform.ingress.suffix }}
schema:
  parameters:
    properties:
      username: { type: string, required: true, default: "admin" }
      password: { type: string, required: true, default: "admin123" }
      volumeReplicas: { type: integer, required: true, default: 1 }
      masterStorage: { type: string, required: true, default: "1" }
      masterLogStorage: { type: string, required: true, default: "0.5" }
      volumeStorage: { type: string, required: true, default: "2" }
      filerStorage: { type: string, required: true, default: "0.5" }
      filerLogStorage: { type: string, required: true, default: "0.5" }
      identitiesSecretName: { type: string, required: true, default: "creds-seaweedfs-identities" }
      adminAccessKey: { type: string, required: true, default: "snu8yoP6QAlY0ne4" }
      adminSecretKey: { type: string, required: true, default: "PNzBcmeLNEdR0oviwm04NQAicOrDH1Km" }
  context:
    properties:
      platform:
        required: true
        properties:
          certificateIssuers:
            required: true
            properties:
              selfSigned:
                properties:
                  name: { type: string, required: true }
          storageClass:
            required: true
            properties:
              data: { type: string, required: true }
          ingress:
            required: true
            properties:
              suffix: { type: string, required: true }
modules:
  - name: auth-config
    source:
      oci:
        # FIXME: temporary personal GHCR while the inline-credentials change (chart 1.1.0) is validated;
        # switch back to quay.io/okdp/charts/seaweedfs-auth-config once merged upstream.
        repository: ghcr.io/alex-mabrouk/okdp-charts/seaweedfs-auth-config
        tag: 1.1.0
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $domain := printf "%v" .Context.platform.ingress.suffix -}}
      {{- $storage := .Context.defaultStorage -}}

      iamConfig:
        sts:
          tokenDuration: "1h"
          maxSessionLength: "12h"
          issuer: "seaweedfs-sts"
          signingKey: ""

        # -- IAM policies to define in the SeaweedFS IAM config.
        policies:
          - name: "S3WritePolicy"
            document:
              Version: "2012-10-17"
              Statement:
                - Effect: "Allow"
                  Action: ["s3:List*","s3:Get*","s3:Put*","s3:DeleteObject"]
                  Resource: ["*"]

        # -- IAM roles to define in the SeaweedFS IAM config.
        roles:
          - roleName: "S3WriteRole"
            roleArn: "{{ $storage.provider.sts.roleArn }}"
            attachedPolicies: ["S3WritePolicy"]
            trustPolicy:
              Version: "2012-10-17"
              Statement:
                # Polaris uses Credentials-based STS AssumeRole
                - Effect: "Allow"
                  Principal: "*"
                  Action:
                    - "sts:AssumeRole"

      s3Config:
        enabled: true
        secretName: {{ .Parameters.identitiesSecretName }}
        identities:
          - name: seaweedfs
            credentials:
              accessKey: {{ .Parameters.adminAccessKey | quote }}
              secretKey: {{ .Parameters.adminSecretKey | quote }}
            actions:
              - Admin
          {{- range $grant := $storage.grants }}
          {{- $buckets := $grant.buckets | default (list "*") }}
          - name: {{ $grant.principal | quote }}
            credentialsSecret:
              name: {{ $grant.credentialsSecret.name | quote }}
              accessKeyKey: {{ $grant.credentialsSecret.accessKeyKey | quote }}
              secretKeyKey: {{ $grant.credentialsSecret.secretKeyKey | quote }}
            actions:
              {{- range $action := $grant.actions }}
              {{- $verb := $action | title }}
              {{- if has "*" $buckets }}
              - {{ $verb }}
              {{- else }}
              {{- range $b := $buckets }}
              - {{ printf "%s:%s" $verb $b }}
              {{- end }}
              {{- end }}
              {{- end }}
          {{- end }}

      filer:
        auth:
          method: basic
          basic:
            create_auth_secret: creds-seaweedfs-filer-basic
            username: {{ .Parameters.username }}
            password: {{ .Parameters.password }}

  - name: main
    dependsOn:
      - auth-config
    timeout: 10m
    source:
      helmRepository:
        url: https://seaweedfs.github.io/seaweedfs/helm
        chart: seaweedfs
        version: 4.17.0
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $domain := printf "%v" .Context.platform.ingress.suffix -}}

      {{- $seaweedfsS3Url := .Context.defaultStorage.provider.endpoints.apiUrl
         | replace "{{ .Release.namespace }}" $namespace
         | replace "{{ .Release.metadata.name }}" $release
         | replace "{{ .Context.ingress.suffix }}" $domain -}}

      {{- $seaweedfsFilerUrl := .Context.defaultStorage.provider.endpoints.consoleUrl
         | replace "{{ .Release.namespace }}" $namespace
         | replace "{{ .Release.metadata.name }}" $release
         | replace "{{ .Context.ingress.suffix }}" $domain -}}

      {{- $seaweedfsS3Host := regexReplaceAll "^https?://" $seaweedfsS3Url "" -}}
      {{- $seaweedfsFilerHost := regexReplaceAll "^https?://" $seaweedfsFilerUrl "" -}}

      {{- $needSts := false -}}
      {{- range $g := .Context.defaultStorage.grants }}{{- if $g.sts }}{{- $needSts = true -}}{{- end }}{{- end }}

      nameOverride: "{{ .Release.metadata.name }}"
      fullnameOverride: "{{ .Release.metadata.name }}"

      global:
        imageName: chrislusf/seaweedfs

      image:
        tag: "4.17"

      master:
        enabled: true
        replicas: 1
        data:
          type: "persistentVolumeClaim"
          storageClass: "{{ .Context.platform.storageClass.workspace }}"
          size: "{{ .Parameters.masterStorage }}Gi"

        logs:
          type: "persistentVolumeClaim"
          storageClass: "{{ .Context.platform.storageClass.workspace }}"
          size: "{{ .Parameters.masterLogStorage }}Gi"

      volume:
        enabled: true
        replicas: {{ .Parameters.volumeReplicas }}
        dataDirs:
          - name: data
            type: "persistentVolumeClaim"
            storageClass: "{{ .Context.platform.storageClass.workspace }}"
            size: "{{ .Parameters.volumeStorage }}Gi"
            maxVolumes: 0

      filer:
        enabled: true
        replicas: 1
        enablePVC: true
        port: 8888
        data:
          type: "persistentVolumeClaim"
          storageClass: "{{ .Context.platform.storageClass.workspace }}"
          size: "{{ .Parameters.filerStorage }}Gi"
        logs:
          type: "persistentVolumeClaim"
          storageClass: "{{ .Context.platform.storageClass.workspace }}"
          size: "{{ .Parameters.filerLogStorage }}Gi"
        ingress:
          enabled: true
          className: nginx
          annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "130m"
            cert-manager.io/cluster-issuer: "{{ .Context.platform.certificateIssuers.selfSigned.name }}"
            nginx.ingress.kubernetes.io/auth-type: basic
            nginx.ingress.kubernetes.io/auth-secret: creds-seaweedfs-filer-basic
            nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
          host: {{ $seaweedfsFilerHost }}
          path: "/"
          pathType: Prefix
          tls:
            - secretName: seaweedfs-filer-tls
              hosts:
                - {{ $seaweedfsFilerHost }}

      s3:
        enabled: true
        enableAuth: true
        existingConfigSecret: {{ .Parameters.identitiesSecretName }}
        createBuckets:
          {{- range $bucket := .Context.defaultStorage.buckets }}
          - name: {{ $bucket.name | quote }}
            anonymousRead: {{ $bucket.anonymousRead | default false }}
          {{- end }}

        extraVolumes: |
          - name: auth-config
            configMap:
              name: {{ .Release.metadata.name }}-auth-config

        extraVolumeMounts: |
          - name: auth-config
            mountPath: /etc/seaweed/iam
            readOnly: true
        {{- if $needSts }}
        extraArgs:
          - "-iam.config=/etc/seaweed/iam/iam.json"
        {{- end }}

        ingress:
          enabled: true
          className: nginx
          annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "130m"
            cert-manager.io/cluster-issuer: "{{ .Context.platform.certificateIssuers.selfSigned.name }}"
          host: {{ $seaweedfsS3Host }}
          path: "/"
          pathType: Prefix
          tls:
            - secretName: seaweedfs-s3-tls
              hosts:
              - {{ $seaweedfsS3Host }}

roles:
  - storage
dependencies:
  - ingress
  # - database-server
