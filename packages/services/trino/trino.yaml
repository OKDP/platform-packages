# Consumes hive and s3 Connections. Produces one trino Connection per
# instance (kcd-<release>-endpoint).
apiVersion: v1alpha1
name: trino
tag: 1.0.0 # x-release-please-version
protected: false
description: |
  Apache Trino - Distributed SQL query engine designed for large-scale data processing across multiple data sources.
  High-performance, in-memory query engine that enables fast, interactive analytics on diverse data systems.
  Supports querying data from multiple databases, data warehouses, and big data platforms in a single query.
usage:
  text: |
    Apache Trino provides distributed SQL query engine designed for large-scale data processing.
    Access the UI at https://trino-{{ .Release.spec.targetNamespace }}.{{ .Context.ingress.suffix }}
schema:
  parameters:
    properties:
      hiveCatalogs:
        title: "Catalogs | Hive catalogs | | order:1"
        type: array
        description: "Hive catalogs, one Trino catalog per item, each on its own metastore and object store."
        items:
          properties:
            name: { type: string, required: true, description: "Trino catalog name." }
            metastore: { type: connectionRef, contract: hive, required: true, description: "Hive metastore connection backing this catalog." }
            storage: { type: connectionRef, contract: s3, required: true, description: "S3 object store connection backing this catalog." }
            s3SecretRef: { type: string, description: "S3 identity used against this store. Secret with keys: accessKey, secretKey. Defaults to the instance s3SecretRef." }
      icebergCatalogs:
        title: "Catalogs | Iceberg REST catalogs | | order:2"
        type: array
        description: "Iceberg REST catalogs (Polaris), one Trino catalog per item, each on its own object store."
        items:
          properties:
            name: { type: string, required: true, description: "Trino catalog name." }
            catalog: { type: connectionRef, contract: iceberg-catalog, required: true, description: "Iceberg REST catalog connection." }
            storage: { type: connectionRef, contract: s3, required: true, description: "S3 object store connection backing this catalog." }
            warehouse: { type: string, description: "Polaris catalog used as the warehouse. Defaults to the realm published on the connection." }
            oidcSecretRef: { type: string, description: "OAuth client Trino uses against this catalog. Secret with keys: client_id, client_secret. Defaults to creds-<release>-oauth2." }
            oauth2Scope: { type: string, default: "PRINCIPAL_ROLE:ALL", description: "OAuth2 scope requested. Polaris rejects the connector default." }
            s3SecretRef: { type: string, description: "S3 identity used against this store. Secret with keys: accessKey, secretKey. Defaults to the instance s3SecretRef." }
      s3SecretRef: { title: "Catalogs | S3 credentials secret | | order:3", type: string, description: "Default S3 identity of this instance, used by any catalog that does not name its own. Secret with keys: accessKey, secretKey." }
      numWorkers: { type: integer, default: 1, title: "Sizing | Workers | stepper | order:1 columns:2 advanced:true", description: "Number of workers" }
      workerCpu: { type: number, default: 0.5, multipleOf: 0.25, title: "Sizing | Worker CPU (vCPU) | | order:2 columns:2 advanced:true", description: "Worker CPU request in vCPU." }
      workerMemoryGi: { type: number, default: 2, multipleOf: 0.25, title: "Sizing | Worker memory (GiB) | | order:3 columns:2 advanced:true", description: "Worker memory (GiB) used for Kubernetes requests/limits (recommended: request=limit)." }
      coordinatorMemoryGi: { type: number, default: 8, multipleOf: 0.25, title: "Sizing | Coordinator memory (GiB) | | order:4 columns:2 advanced:true" }
      enableOPA: { title: "Authorization | Enable OPA | | order:1", type: boolean, default: true, description: "Whether to enable OPA." }
      enableOPAL: { title: "Authorization | Enable OPAL | | order:3 condition:enableOPA=true", type: boolean, default: false, description: "Whether to enable OPAL. When false, OPA policies are loaded from labeled ConfigMaps by the kube-mgmt sidecar." }
      enableOPADebugLogs: { title: "Authorization | Debug logs | | order:8 advanced:true condition:enableOPA=true", type: boolean, default: false, description: "Log OPA status and decision logs to the container console. Verbose, intended for debugging." }
      policyRepoUrl: { title: "Authorization | Policy repository | | order:4 advanced:true condition:enableOPAL=true", type: string, default: "https://github.com/OKDP/okdp-examples.git", description: "OPA policy repo URL" }
      policyRepoMainBranch: { title: "Authorization | Policy branch | | order:5 columns:2 advanced:true condition:enableOPAL=true", type: string, default: "main", description: "OPA policy repo branch." }
      OPAL_POLICY_SUBSCRIPTION_DIRS: { title: "Authorization | Policy directories | | order:6 advanced:true condition:enableOPAL=true",type: string, default: "trino_opa_policy", description: "Policy directories in the repository for which the client will subscribe to, separated by ':'."}
      OPAL_POLICY_REPO_MANIFEST_PATH: { title: "Authorization | Policy manifest path | | order:7 advanced:true condition:enableOPAL=true", type: string, default: "trino_opa_policy", description: "The location of the manifest file in the remote repository."}
      opaPolicyPath: { title: "Authorization | Policy path | | order:2 advanced:true condition:enableOPA=true",type: string, default: "v1/data/trino/allow", description: "Path of the OPA policies for Trino used in the Trino variable opa.policy.uri."}
  context:
    properties:
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            properties:
              name: { type: string, required: true }
      ingress:
        required: true
        properties:
          suffix: { type: string, required: true }
          className: { type: string, required: true }
      oidc:
        required: true
        properties:
          issuerUri: { type: string, required: true }
          authUrl: { type: string, required: true }
          tokenUrl: { type: string, required: true }
          jwksUri: { type: string, required: true }
          scope: { type: string, default: "openid profile email groups" }
          clientProvisioning: { type: string, default: existing }
          # Read only when clientProvisioning is dcr.
          dcr:
            properties:
              registrationUrl: { type: string }
              authMethod: { type: string }

modules:
  - name: internal-secrets
    source:
      local:
        path: ../../../charts/internal-secrets
    values: |
      secrets:
        - name: "creds-{{ .Release.metadata.name }}-internal"
          fields:
            - fieldName: shared-secret
              encoding: base64
              length: "32"
  - name: opa
    enabled: "{{ .Parameters.enableOPA }}"
    timeout: 10m
    source:
      helmRepository:
        url: https://open-policy-agent.github.io/kube-mgmt/charts
        chart: opa-kube-mgmt
        version: 11.0.7
    values: |
      fullnameOverride: {{ .Release.metadata.name }}-opa
      authz:
        enabled: false
      image:
        repository: openpolicyagent/opa
        tag: 1.16.1
        pullPolicy: IfNotPresent
      useHttps: false
      port: 8181
      {{- if .Parameters.enableOPADebugLogs }}
      extraArgs:
        - "--set=status.console=true"
        - "--set=decision_logs.console=true"
      {{- end }}
      mgmt:
        enabled: {{ not .Parameters.enableOPAL }}
        startupProbe:
          failureThreshold: 5
          httpGet:
            path: /health
            port: 8181
            scheme: HTTP
          initialDelaySeconds: 20
          successThreshold: 1
          timeoutSeconds: 10
        data:
          enabled: true
        policies:
          enabled: true
      rbac:
        create: {{ not .Parameters.enableOPAL }}
      serviceAccount:
        create: {{ not .Parameters.enableOPAL }}

  - name: opal-secrets
    enabled: "{{ and .Parameters.enableOPA .Parameters.enableOPAL }}"
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/opal-secrets
        tag: 0.1.1
    values: |
      fullnameOverride: {{ .Release.metadata.name }}-opal-secrets
  - name: opal
    enabled: "{{ and .Parameters.enableOPA .Parameters.enableOPAL }}"
    dependsOn:
      - opa
      - opal-secrets
    timeout: 10m
    source:
      helmRepository:
        url: https://permitio.github.io/opal-helm-chart
        chart: opal
        version: 0.0.30
    values: |
      image:
        client:
          registry: docker.io
          repository: permitio/opal-client-standalone
          tag: 0.9.4
        server:
          registry: docker.io
          repository: permitio/opal-server
          tag: 0.9.4

      client:
        extraEnv:
          OPAL_POLICY_STORE_URL: http://{{ .Release.metadata.name }}-opa.{{ .Release.spec.targetNamespace }}:8181
          OPAL_POLICY_SUBSCRIPTION_DIRS: "{{ .Parameters.OPAL_POLICY_SUBSCRIPTION_DIRS }}"
        secrets:
          - opal-client-token-secret

      server:
        policyRepoUrl: "{{ .Parameters.policyRepoUrl }}"
        policyRepoMainBranch: "{{ .Parameters.policyRepoMainBranch }}"
        secrets:
          - opal-ssh-secret
          - opal-master-token-secret

        extraEnv:
          OPAL_POLICY_REPO_MANIFEST_PATH: "{{ .Parameters.OPAL_POLICY_REPO_MANIFEST_PATH }}"
          {{- with .Context.proxy }}
          {{- if or .httpProxy .httpsProxy .noProxy }}
          {{- with .httpProxy }}
          HTTP_PROXY: {{ . | quote }}
          {{- end }}
          {{- with .httpsProxy }}
          HTTPS_PROXY: {{ . | quote }}
          {{- end }}
          {{- with .noProxy }}
          NO_PROXY: {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- end }}

  - name: oidc-dcr
    enabled: '{{ eq (.Context.oidc.clientProvisioning | default "existing") "dcr" }}'
    timeout: 10m
    source:
      oci:
        repository: quay.io/adaltas/oidc-dcr
        tag: 0.3.2
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $domain := printf "%v" .Context.ingress.suffix -}}

      {{- $oidcIssuerUri := .Context.oidc.issuerUri -}}
      {{- $dcr := .Context.oidc.dcr | default dict -}}
      {{- if and (eq (.Context.oidc.clientProvisioning | default "existing") "dcr") (ne ($dcr.authMethod | default "") "anonymous") }}
      {{- fail (printf "oidc.dcr.authMethod %q is not supported: this package registers anonymously" ($dcr.authMethod | default "")) }}
      {{- end }}
      {{- $oidcRegistrationUrl := $dcr.registrationUrl -}}

      ttl_seconds: 30
      registration_url: "{{ $oidcRegistrationUrl }}"
      request:
        application_type: web
        client_name: "{{ $release }}-{{ $namespace }}"
        redirect_uris:
          - "https://trino-{{ $namespace }}.{{ $domain }}/oauth2/callback"
        logo_uri: "https://landscape.cncf.io/logos/008125b82108f19aea6b0004ce5f255b72bab5b5e5c169a302d7bf845edb8e6b.svg"
        grant_types:
          - "authorization_code"
          - "client_credentials"
        # Keycloak realm client scopes granted to the registered client.
        scope: "web-origins acr roles profile groups basic email address phone organization offline_access microprofile-jwt"
      tls:
        insecure: false
        certificate: "certs-bundle"
      secret: "{{ $release }}-{{ $namespace }}-dcr"
      mapping:
        use_default: false
        key_mapping:
          OIDC_CLIENT_ID: ".client_id"
          OIDC_CLIENT_SECRET: ".client_secret"
          OIDC_ISSUER_URL: "{{ $oidcIssuerUri }}"
          OIDC_SCOPES: "{{ .Context.oidc.scope }}"

  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://trinodb.github.io/charts/
        chart: trino
        version: v1.42.1
    values: |

      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $domain := printf "%v" .Context.ingress.suffix -}}

      {{- $oidcIssuerUri := .Context.oidc.issuerUri -}}
      {{- $oidcAuthUrl := .Context.oidc.authUrl -}}
      {{- $oidcTokenUrl := .Context.oidc.tokenUrl -}}
      {{- $oidcJwksUrl := .Context.oidc.jwksUri -}}

      {{- $oidcScopes := (.Context.oidc.scope | default "openid profile email groups") | replace " " "," -}}
      {{- $oauthSecret := printf "creds-%s-oauth2" $release -}}
      {{- $enableDCR := eq (.Context.oidc.clientProvisioning | default "existing") "dcr" -}}

      {{- $trinoEndpoint := printf "trino-%s.%s" $namespace $domain -}}

      {{- $hiveCatalogs := .Parameters.hiveCatalogs | default list -}}
      {{- $icebergCatalogs := .Parameters.icebergCatalogs | default list -}}
      {{- $defaultS3Secret := .Parameters.s3SecretRef | default "" -}}

      image:
        repository: trinodb/trino
        tag: 480

      {{- if or $hiveCatalogs $icebergCatalogs }}
      catalogs:
        {{- range $c := $hiveCatalogs }}
        {{- $envPrefix := upper (replace "-" "_" $c.name) }}
        {{ $c.name }}: |
          connector.name=hive
          hive.metastore.uri={{ $c.metastore.thriftUri }}
          fs.native-s3.enabled=true
          s3.endpoint={{ $c.storage.apiUrl }}
          s3.path-style-access={{ $c.storage.pathStyle | default false }}
          s3.region={{ $c.storage.region }}
          s3.aws-access-key=${ENV:S3_ACCESS_KEY_{{ $envPrefix }}}
          s3.aws-secret-key=${ENV:S3_SECRET_ACCESS_{{ $envPrefix }}}
        {{- end }}
        {{- range $ic := $icebergCatalogs }}
        {{- $envPrefix := upper (replace "-" "_" $ic.name) }}
        {{ $ic.name }}: |
          connector.name=iceberg
          iceberg.catalog.type=rest
          iceberg.rest-catalog.uri={{ $ic.catalog.internalUri | default $ic.catalog.uri }}
          iceberg.rest-catalog.warehouse={{ $ic.warehouse | default $ic.catalog.realm }}
          iceberg.rest-catalog.security=OAUTH2
          iceberg.rest-catalog.oauth2.credential=${ENV:ICEBERG_OAUTH_{{ $envPrefix }}}
          iceberg.rest-catalog.oauth2.scope={{ $ic.oauth2Scope | default "PRINCIPAL_ROLE:ALL" }}
          iceberg.rest-catalog.oauth2.server-uri={{ $ic.catalog.internalUri | default $ic.catalog.uri }}/v1/oauth/tokens
          iceberg.rest-catalog.vended-credentials-enabled=false
          fs.native-s3.enabled=true
          s3.endpoint={{ $ic.storage.apiUrl }}
          s3.path-style-access={{ $ic.storage.pathStyle | default false }}
          s3.region={{ $ic.storage.region }}
          s3.aws-access-key=${ENV:S3_ACCESS_KEY_{{ $envPrefix }}}
          s3.aws-secret-key=${ENV:S3_SECRET_ACCESS_{{ $envPrefix }}}
        {{- end }}
      {{- end }}

      env:
        - name: TRINO_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              {{- if $enableDCR }}
              name: {{ $release }}-{{ $namespace }}-dcr
              key: OIDC_CLIENT_ID
              {{- else }}
              name: {{ $oauthSecret }}
              key: client_id
              {{- end }}

        - name: TRINO_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              {{- if $enableDCR }}
              name: {{ $release }}-{{ $namespace }}-dcr
              key: OIDC_CLIENT_SECRET
              {{- else }}
              name: {{ $oauthSecret }}
              key: client_secret
              {{- end }}

        {{- range $ic := $icebergCatalogs }}
        {{- $envPrefix := upper (replace "-" "_" $ic.name) }}
        - name: ICEBERG_OAUTH_CLIENT_ID_{{ $envPrefix }}
          valueFrom:
            secretKeyRef:
              name: {{ $ic.oidcSecretRef | default $oauthSecret }}
              key: client_id
        - name: ICEBERG_OAUTH_CLIENT_SECRET_{{ $envPrefix }}
          valueFrom:
            secretKeyRef:
              name: {{ $ic.oidcSecretRef | default $oauthSecret }}
              key: client_secret
        # Kubernetes expands $(VAR) from variables declared earlier in this list.
        - name: ICEBERG_OAUTH_{{ $envPrefix }}
          value: "$(ICEBERG_OAUTH_CLIENT_ID_{{ $envPrefix }}):$(ICEBERG_OAUTH_CLIENT_SECRET_{{ $envPrefix }})"
        {{- end }}

        - name: TRINO_SHARED_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ printf "creds-%s-internal" .Release.metadata.name }}
              key: shared-secret

        - name: TRUSTSTORE_PASSWORD
          value: ""

        {{- range $c := concat $hiveCatalogs $icebergCatalogs }}
        {{- $envPrefix := upper (replace "-" "_" $c.name) }}
        {{- $s3Secret := $c.s3SecretRef | default $defaultS3Secret }}
        {{- if not $s3Secret }}{{ fail (printf "catalog %q: no S3 credentials, set s3SecretRef on the catalog or on the release" $c.name) }}{{ end }}
        - name: S3_ACCESS_KEY_{{ $envPrefix }}
          valueFrom:
            secretKeyRef:
              name: {{ $s3Secret }}
              key: accessKey

        - name: S3_SECRET_ACCESS_{{ $envPrefix }}
          valueFrom:
            secretKeyRef:
              name: {{ $s3Secret }}
              key: secretKey
        {{- end }}

      coordinator:
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "{{ .Parameters.coordinatorMemoryGi }}Gi"

        additionalVolumes:
          - name: cacerts
            secret:
              secretName: certs-bundle

        additionalVolumeMounts:
          - name: cacerts
            mountPath: /cacerts
            readOnly: true

        additionalJVMConfig:
          - "-Djavax.net.ssl.trustStore=/cacerts/bundle.p12"
          - "-Djavax.net.ssl.trustStorePassword=${ENV:TRUSTSTORE_PASSWORD}"

      worker:
        resources:
          requests:
            cpu: "{{ .Parameters.workerCpu }}"
            memory: "{{ .Parameters.workerMemoryGi }}Gi"
          limits:
            cpu: "{{ mulf (float64 .Parameters.workerCpu) 2 }}"
            memory: "{{ mulf (float64 .Parameters.workerMemoryGi) 2 }}Gi"

        additionalVolumes:
          - name: cacerts
            secret:
              secretName: certs-bundle

        additionalVolumeMounts:
          - name: cacerts
            mountPath: /cacerts
            readOnly: true

        additionalJVMConfig:
          - "-Djavax.net.ssl.trustStore=/cacerts/bundle.p12"
          - "-Djavax.net.ssl.trustStorePassword=${ENV:TRUSTSTORE_PASSWORD}"

      ingress:
        enabled: true
        className: {{ .Context.ingress.className }}
        annotations:
          cert-manager.io/cluster-issuer: "{{ .Context.certificateIssuers.selfSigned.name }}"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          nginx.ingress.kubernetes.io/use-regex: "true"
        hosts:
          - host: {{ $trinoEndpoint }}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - {{ $trinoEndpoint }}
            secretName: {{ .Release.metadata.name }}-tls

      server:
        workers: {{ .Parameters.numWorkers }}
        node:
          environment: sandbox
        config:
          authenticationType: "oauth2"
          coordinator: "true"
          node-scheduler.include-coordinator: "true"
          discovery-server.enabled: "true"
          path: /etc/trino
          https:
            enabled: false
        workerExtraConfig: ""
        coordinatorExtraConfig: |
          http-server.process-forwarded=true
          web-ui.authentication.type=oauth2
          # Enable two authentication flows on the coordinator:
          # - OAUTH2: interactive browser-based login for human users (UI/CLI with external authentication)
          # - JWT: non-interactive bearer token authentication for automation/service accounts
          #   such as scripts, jobs, or CI/CD using --access-token
          http-server.authentication.type=jwt,oauth2
          # In-cluster clients reach the coordinator on plain HTTP. Without this,
          # Trino answers 403 to any authenticated call that is not TLS.
          http-server.authentication.allow-insecure-over-http=true
          http-server.authentication.oauth2.issuer={{ $oidcIssuerUri }}
          http-server.authentication.oauth2.client-id=${ENV:TRINO_OAUTH_CLIENT_ID}
          http-server.authentication.oauth2.client-secret=${ENV:TRINO_OAUTH_CLIENT_SECRET}
          http-server.authentication.oauth2.auth-url={{ $oidcAuthUrl }}
          http-server.authentication.oauth2.token-url={{ $oidcTokenUrl }}
          http-server.authentication.oauth2.scopes={{ $oidcScopes }}
          http-server.authentication.oauth2.principal-field=preferred_username

          http-server.authentication.jwt.key-file={{ $oidcJwksUrl }}
          http-server.authentication.jwt.required-issuer={{ $oidcIssuerUri }}
          http-server.authentication.jwt.required-audience=account
          http-server.authentication.jwt.principal-field=client_id

      additionalConfigProperties:
        - internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}

      {{- if .Parameters.enableOPA }}
      accessControl:
        type: properties
        properties: |
          access-control.name=opa
          opa.policy.uri=http://{{ .Release.metadata.name }}-opa.{{ .Release.spec.targetNamespace }}:8181/{{ .Parameters.opaPolicyPath }}
          opa.log-responses=true
          opa.log-requests=true
      {{- end }}
# One trino Connection per instance, named 'kcd-<release>-endpoint'. Two
# releases of this package = two distinct Connections.
outputs: |
  - name: endpoint
    contract: trino
    values:
      url: "https://trino-{{ .Release.spec.targetNamespace }}.{{ .Context.ingress.suffix }}"
      uri: "trino://trino@trino-{{ .Release.spec.targetNamespace }}.{{ .Context.ingress.suffix }}:443"
      internalUri: "trino://trino@{{ .Release.metadata.name }}-main-trino.{{ .Release.spec.targetNamespace }}.svc.cluster.local:8080"
      catalogs:
        - tpch
        - tpcds
        {{- range $c := (.Parameters.hiveCatalogs | default list) }}
        - "{{ $c.name }}"
        {{- end }}
        {{- range $c := (.Parameters.icebergCatalogs | default list) }}
        - "{{ $c.name }}"
        {{- end }}
roles:
  - interactive-query
dependencies:
  - data-catalog
  - ingress
