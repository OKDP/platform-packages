apiVersion: v1alpha1
name: okdp-examples
tag: 1.0.0 # x-release-please-version
protected: false
description: |
  A collection of hands-on examples, helper utilities, Jupyter notebooks, 
  and data workflows that showcases how to work with the OKDP Platform.
usage:
  text: |
    A collection of hands-on examples, helper utilities, Jupyter notebooks,
    and data workflows that showcases how to work with the OKDP Platform.
schema:
  parameters:
    properties:
      memoryGi: { title: "Resources | Memory (GiB) | | order:2 columns:2", type: number, default: 0.5, multipleOf: 0.25, description: "Memory (GiB) used for Kubernetes requests/limits (recommended: request=limit)." }
      cpu: { title: "Resources | CPU (vCPU) | | order:1 columns:2", type: number, default: 0.5, multipleOf: 0.25, description: "CPU request in millicores (e.g., 500=0.5 vCPU, 1000=1 vCPU)." }
      storage: { title: "Connections | Object store | | order:1", type: connectionRef, contract: s3, required: true, description: "S3 store where the medallion buckets live." }
      s3SecretRef: { title: "Connections | S3 credentials secret | | order:2", type: string, required: true, description: "S3 identity of the seed job. Secret with keys: accessKey, secretKey." }
      trino: { title: "Connections | Trino | | order:3", type: connectionRef, contract: trino, required: true, description: "Trino instance carrying the bronze catalog." }
      trinoOidcSecretRef: { title: "Connections | Trino OAuth client secret | | order:4", type: string, required: true, description: "OAuth client used against Trino. Secret with keys: client_id, client_secret." }
      polaris: { title: "Connections | Iceberg REST catalog | | order:5", type: connectionRef, contract: iceberg-catalog, required: true, description: "Polaris instance where the silver and gold catalogs are provisioned." }
      bronzeBucket: { title: "Lakehouse | Bronze bucket | | order:1 columns:3", type: string, default: "bronze" }
      silverBucket: { title: "Lakehouse | Silver bucket | | order:2 columns:3", type: string, default: "silver" }
      goldBucket: { title: "Lakehouse | Gold bucket | | order:3 columns:3", type: string, default: "gold" }
      bronzePrefix: { title: "Lakehouse | Bronze prefix | | order:4 columns:2", type: string, default: "mobility/nyc_tlc" }
      bronzeDataUrl: { title: "Lakehouse | Datasets URL | | order:5 columns:2", type: string, default: "https://d37ci6vzurychx.cloudfront.net/trip-data", description: "Public NYC TLC parquet source." }
      sparkEventsLogDir: { title: "Lakehouse | Spark events log dir | | order:6 advanced:true", type: string, default: "s3a://spark-events/event-logs", description: "Spark History log directory, created if missing." }
      polarisRealms:
        title: "Polaris | Realms | | order:7 advanced:true"
        type: object
        required: true
        properties: {}
        additionalProperties: true
        description: "Realms model applied by polaris-admin: catalogs, roles, principals. One principal per realm must carry the catalog_admin role and a credentialsSecret."
  context:
    properties:
      oidc:
        required: true
        properties:
          issuerUri: { type: string, required: true }
      proxy:
        properties:
          httpProxy: { type: string, default: "" }
          httpsProxy: { type: string, default: "" }
          noProxy: { type: string, default: "" }
modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/okdp-examples
        tag: 1.3.0
    values: |

      {{- $oidcIssuerUri := .Context.oidc.issuerUri -}}
      {{- $storageApiUrl := .Parameters.storage.internalUrl | default .Parameters.storage.apiUrl -}}
      {{- $trinoEndpoint := .Parameters.trino.url -}}
      {{- $polarisEndpointUrl := .Parameters.polaris.internalUri | default .Parameters.polaris.uri -}}
      {{- /* The connection publishes the Iceberg REST base; polaris-admin wants the server root. */ -}}
      {{- $polarisEndpointUrl = trimSuffix "/api/catalog" $polarisEndpointUrl -}}

      replicaCount: 1
      image:
        repository: quay.io/okdp/okdp-examples
        tag: 1.2.0
        pullPolicy: Always
      
      extraEnvRaw:
        - name: MC_INSECURE
          value: "1"
        - name: S3_ENDPOINT
          value: {{ $storageApiUrl }}
      
        # Bronze Layer
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.s3SecretRef }}
              key: accessKey
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.s3SecretRef }}
              key: secretKey

        - name: BRONZE_BUCKET
          value: {{ .Parameters.bronzeBucket | quote }}
        - name: BRONZE_BUCKET_PREFIX
          value: {{ .Parameters.bronzePrefix }}
        - name: BRONZE_DATA_URL
          value: {{ .Parameters.bronzeDataUrl }}
        - name: SILVER_BUCKET
          value: {{ .Parameters.silverBucket | quote }}
        - name: GOLD_BUCKET
          value: {{ .Parameters.goldBucket | quote }}

        - name: TRINO_SERVER_URL
          value: {{ $trinoEndpoint }}
        - name: TRINO_TERMINAL
          value: dumb
        - name: EXAMPLES_TRINO_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.trinoOidcSecretRef }}
              key: client_id
        - name: EXAMPLES_TRINO_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.trinoOidcSecretRef }}
              key: client_secret

        - name: SPARK_EVENT_LOG_DIRECTORY
          value: {{ .Parameters.sparkEventsLogDir }}
        {{- if .Context.proxy.httpProxy }}
        - name: HTTP_PROXY
          value: {{ .Context.proxy.httpProxy | quote }}
        {{- end }}
        {{- if .Context.proxy.httpsProxy }}
        - name: HTTPS_PROXY
          value: {{ .Context.proxy.httpsProxy | quote }}
        {{- end }}
        {{- if .Context.proxy.noProxy }}
        - name: NO_PROXY
          value: {{ .Context.proxy.noProxy | quote }}
        {{- end }}
        # Polaris
        - name: OIDC_ISSUER_URL
          value: {{ $oidcIssuerUri }}
        - name: POLARIS_URL
          value: {{ $polarisEndpointUrl }}
        - name: CA_CERT_PATH
          value: /cacerts/ca.crt
        - name: CURL_CA_BUNDLE
          value: /cacerts/ca.crt
        - name: TRUSTSTORE_PASSWORD
          value: ""
        {{- range $realm := .Parameters.polarisRealms.realms }}
        {{- $realmPrefix := regexReplaceAll "_+" (regexReplaceAll "[^A-Za-z0-9]+" (upper $realm.name) "_") "_" | trimAll "_" -}}
        {{- $selected := dict "principal" nil "found" false -}}
        
        {{- range $p := ($realm.principals | default list) }}
        {{- if and (not (get $selected "found")) (has "catalog_admin" ($p.principalRoles | default list)) $p.credentialsSecret }}
        {{- $_ := set $selected "principal" $p -}}
        {{- $_ := set $selected "found" true -}}
        {{- end }}
        {{- end }}
        
        {{- $principal := get $selected "principal" -}}
        {{- if not $principal }}
        {{- fail (printf "no principal with role 'catalog_admin' found in realm %q" $realm.name) }}
        {{- end }}
        
        {{- if not $principal.credentialsSecret }}
        {{- fail (printf "principal %q in realm %q is missing credentialsSecret" $principal.name $realm.name) }}
        {{- end }}
        
        {{- if not $principal.credentialsSecret.name }}
        {{- fail (printf "principal %q in realm %q is missing credentialsSecret.name" $principal.name $realm.name) }}
        {{- end }}
        
        {{- if not $principal.credentialsSecret.clientIdKey }}
        {{- fail (printf "principal %q in realm %q is missing credentialsSecret.clientIdKey" $principal.name $realm.name) }}
        {{- end }}
        
        {{- if not $principal.credentialsSecret.clientSecretKey }}
        {{- fail (printf "principal %q in realm %q is missing credentialsSecret.clientSecretKey" $principal.name $realm.name) }}
        {{- end }}
      
        - name: {{ printf "%s_POLARIS_OIDC_CLIENT_ID" $realmPrefix }}
          valueFrom:
            secretKeyRef:
              name: {{ $principal.credentialsSecret.name }}
              key: {{ $principal.credentialsSecret.clientIdKey }}
        
        - name: {{ printf "%s_POLARIS_OIDC_CLIENT_SECRET" $realmPrefix }}
          valueFrom:
            secretKeyRef:
              name: {{ $principal.credentialsSecret.name }}
              key: {{ $principal.credentialsSecret.clientSecretKey }}
          {{- end }}
      
      resources:
        requests:
          cpu: "{{ .Parameters.cpu }}"
          memory: "{{ .Parameters.memoryGi }}Gi"
        limits:
          cpu: "{{ mulf (float64 .Parameters.cpu) 2 }}"
          memory: "{{ mulf (float64 .Parameters.memoryGi) 2 }}Gi"      
      
      extraVolumes:
        - name: cacerts
          secret:
            secretName: certs-bundle
      
      extraVolumeMounts:
        - name: cacerts
          mountPath: /cacerts
      
      extraFiles:
        polaris-catalogs:
          mountPath: /etc/polaris/catalogs.yaml
          stringData: |
            {{ .Parameters.polarisRealms | toYaml | nindent 6 }}
  
      commands:
        01-prepare_env:
          01-create-spark-event-log-dir: |
            echo "👉 Connect into S3"
            mc alias set mystorage $S3_ENDPOINT "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
            echo "👉 Storage alias configured successfully."
            echo "👉 Normalize the log directory $SPARK_EVENT_LOG_DIRECTORY"
            no_scheme="${SPARK_EVENT_LOG_DIRECTORY#s3a://}"
            no_scheme="${no_scheme%/}"
            bucket="${no_scheme%%/*}"
            prefix="${no_scheme#$bucket}"
            prefix="${prefix#/}"
            echo "👉 Bucket: $bucket, Prefix: $prefix"
            echo "👉 Create the bucket $bucket if not exist"
            mc mb mystorage/$bucket || true
            echo "👉 upload a zero-byte object to create the prefix: $bucket/$prefix/.keep"
            mc pipe "mystorage/$bucket/$prefix/.keep" < /dev/null
            echo "✅ Spark events log directory $SPARK_EVENT_LOG_DIRECTORY successfully created.";
          02-create-bronze-buckets: |
            echo "👉 Connect into S3"
            mc alias set mystorage $S3_ENDPOINT "$S3_ACCESS_KEY" "$S3_SECRET_KEY"

            echo "👉 Create the bucket $BRONZE_BUCKET if not exist"
            mc mb mystorage/${BRONZE_BUCKET#s3://} || true
      
            echo "👉 Create the bucket $SILVER_BUCKET if not exist"
            mc mb mystorage/${SILVER_BUCKET#s3://} || true
      
            echo "👉 Create the bucket $GOLD_BUCKET if not exist"
            mc mb mystorage/${GOLD_BUCKET#s3://} || true
      
        02-nyc_trip:
          # https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page
          01-download-nyc-tripdata: |
            mkdir -p /data/tripdata
            cd /data/tripdata;
            for dataset in yellow green fhv; do
              for month in 01 02 03; do
                file="{{ "$" }}{dataset}_tripdata_2025-{{ "$" }}{month}.parquet"
                url="$BRONZE_DATA_URL/$file";
                echo "→ $url";
                if curl -fsSLO "$url"; then
                  echo "✅ Downloaded: $file";
                else
                  echo "⚠️ Missing: $file";
                fi;
              done;
            done;
            ls -lh /data/tripdata
            echo "✅ All downloads complete.";
      
          02-upload-nyc-tripdata-into-s3: |

            for category in yellow green fhv; do
              echo "🚀 Processing category: $category"
              for file in /data/tripdata/{{ "$" }}{category}_*.parquet; do
                [ -e "$file" ] || continue  # skip if no files match
                month=$(basename "$file" | sed -E 's/.*_([0-9]{4}-[0-9]{2})\.parquet/\1/')
                echo "📦 Uploading $file → $BRONZE_BUCKET_PREFIX/$category/month=$month/"
                mc cp "$file" "mystorage/$BRONZE_BUCKET/$BRONZE_BUCKET_PREFIX/$category/month=$month/"
              done
            done
            
            echo "👉 Verify bucket structure"
            mc tree mystorage/$BRONZE_BUCKET
            mc ls --recursive mystorage/$BRONZE_BUCKET
    
          03-nyc-tripdata-trino-external-tables.sql: |
            ACCESS_TOKEN="$(
                curl -sS \
                -X POST "$OIDC_ISSUER_URL/protocol/openid-connect/token" \
                -H 'Content-Type: application/x-www-form-urlencoded' \
                --data-urlencode 'grant_type=client_credentials' \
                --data-urlencode "client_id=$EXAMPLES_TRINO_CLIENT_ID" \
                --data-urlencode "client_secret=$EXAMPLES_TRINO_CLIENT_SECRET" \
                | jq -r '.access_token'
            )"
            trino --server $TRINO_SERVER_URL \
                  --access-token "$ACCESS_TOKEN" \
                  --user "$EXAMPLES_TRINO_CLIENT_ID" \
                  --truststore-path /cacerts/bundle.p12 \
                  --truststore-type PKCS12 \
                  --truststore-password "$TRUSTSTORE_PASSWORD" <<SQL
              CREATE SCHEMA IF NOT EXISTS bronze.nyc_tlc;
            
              CREATE TABLE IF NOT EXISTS bronze.nyc_tlc.yellow (
                vendorid INT,
                tpep_pickup_datetime TIMESTAMP,
                tpep_dropoff_datetime TIMESTAMP,
                passenger_count INT,
                trip_distance DOUBLE,
                ratecodeid INT,
                store_and_fwd_flag VARCHAR,
                pulocationid INT,
                dolocationid INT,
                payment_type INT,
                fare_amount DOUBLE,
                extra DOUBLE,
                mta_tax DOUBLE,
                tip_amount DOUBLE,
                tolls_amount DOUBLE,
                improvement_surcharge DOUBLE,
                total_amount DOUBLE,
                congestion_surcharge DOUBLE,
                airport_fee DOUBLE,
                cbd_congestion_fee DOUBLE,
                month VARCHAR
              )
              WITH (
                external_location = 's3a://$BRONZE_BUCKET/$BRONZE_BUCKET_PREFIX/yellow/',
                format = 'PARQUET',
                partitioned_by = ARRAY['month']
              );
            
              CREATE TABLE IF NOT EXISTS bronze.nyc_tlc.green (
                vendorid INT,
                lpep_pickup_datetime TIMESTAMP,
                lpep_dropoff_datetime TIMESTAMP,
                store_and_fwd_flag VARCHAR,
                ratecodeid INT,
                pulocationid INT,
                dolocationid INT,
                passenger_count INT,
                trip_distance DOUBLE,
                fare_amount DOUBLE,
                extra DOUBLE,
                mta_tax DOUBLE,
                tip_amount DOUBLE,
                tolls_amount DOUBLE,
                improvement_surcharge DOUBLE,
                total_amount DOUBLE,
                payment_type INT,
                trip_type INT,
                congestion_surcharge DOUBLE,
                cbd_congestion_fee DOUBLE,
                month VARCHAR
              )
              WITH (
                external_location = 's3a://$BRONZE_BUCKET/$BRONZE_BUCKET_PREFIX/green/',
                format = 'PARQUET',
                partitioned_by = ARRAY['month']
              );
            
              CREATE TABLE IF NOT EXISTS bronze.nyc_tlc.fhv (
                dispatching_base_num VARCHAR,
                pickup_datetime TIMESTAMP,
                dropoff_datetime TIMESTAMP,
                pulocationid INT,
                dolocationid INT,
                sr_flag INT,
                affiliated_base_number VARCHAR,
                month VARCHAR
              )
              WITH (
                external_location = 's3a://$BRONZE_BUCKET/$BRONZE_BUCKET_PREFIX/fhv/',
                format = 'PARQUET',
                partitioned_by = ARRAY['month']
              );
            SQL
      
          04-nyc-tripdata-trino-synchronize-partitions: |
            ACCESS_TOKEN="$(
                curl -sS \
                -X POST "$OIDC_ISSUER_URL/protocol/openid-connect/token" \
                -H 'Content-Type: application/x-www-form-urlencoded' \
                --data-urlencode 'grant_type=client_credentials' \
                --data-urlencode "client_id=$EXAMPLES_TRINO_CLIENT_ID" \
                --data-urlencode "client_secret=$EXAMPLES_TRINO_CLIENT_SECRET" \
                | jq -r '.access_token'
            )"
            trino --server $TRINO_SERVER_URL \
                  --access-token "$ACCESS_TOKEN" \
                  --user "$EXAMPLES_TRINO_CLIENT_ID" \
                  --truststore-path /cacerts/bundle.p12 \
                  --truststore-type PKCS12 \
                  --truststore-password "$TRUSTSTORE_PASSWORD" <<SQL
              CALL bronze.system.sync_partition_metadata(
                schema_name => 'nyc_tlc',
                table_name => 'yellow',
                mode => 'ADD'
              );
              CALL bronze.system.sync_partition_metadata(
                schema_name => 'nyc_tlc',
                table_name => 'green',
                mode => 'ADD'
              );
              CALL bronze.system.sync_partition_metadata(
                schema_name => 'nyc_tlc',
                table_name => 'fhv',
                mode => 'ADD'
              );
            SQL
      
          05-nyc-tripdata-trino-validate: |
            ACCESS_TOKEN="$(
                curl -sS \
                -X POST "$OIDC_ISSUER_URL/protocol/openid-connect/token" \
                -H 'Content-Type: application/x-www-form-urlencoded' \
                --data-urlencode 'grant_type=client_credentials' \
                --data-urlencode "client_id=$EXAMPLES_TRINO_CLIENT_ID" \
                --data-urlencode "client_secret=$EXAMPLES_TRINO_CLIENT_SECRET" \
                | jq -r '.access_token'
            )"
            trino --server $TRINO_SERVER_URL \
                  --access-token "$ACCESS_TOKEN" \
                  --user "$EXAMPLES_TRINO_CLIENT_ID" \
                  --truststore-path /cacerts/bundle.p12 \
                  --truststore-type PKCS12 \
                  --truststore-password "$TRUSTSTORE_PASSWORD" <<SQL
              SHOW SCHEMAS FROM bronze;
            
              SHOW TABLES FROM bronze.nyc_tlc;
            
              DESCRIBE bronze.nyc_tlc.yellow;
              DESCRIBE bronze.nyc_tlc.green;
              DESCRIBE bronze.nyc_tlc.fhv;
            
              SELECT *
              FROM bronze.nyc_tlc.yellow
              LIMIT 10;
            SQL
        03-polaris:
          01-polaris-apply-catalogs: |
            polaris-admin --catalog-file /etc/polaris/catalogs.yaml

roles:
  - examples
dependencies:
  - storage
  - metastore-catalog
  - iceberg-catalog
  - interactive-query
