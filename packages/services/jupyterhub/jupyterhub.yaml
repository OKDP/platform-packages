# Consumes one s3 Connection (storage). s3SecretRef and oidcClientSecretRef
# name this instance's own identities.

apiVersion: v1alpha1
name: jupyterhub
tag: 1.0.0 # x-release-please-version
protected: false
description: |
  JupyterHub - Multi-user interactive development environment for data science and machine learning.
  Provides secure, scalable Jupyter notebook access with integrated authentication, resource management,
  and pre-configured Spark-enabled notebooks for big data analytics.
usage:
  text: |
    JupyterHub provides multi-user Jupyter notebook environment with OAuth authentication.
    Access the hub at https://jupyterhub-{{ .Release.spec.targetNamespace }}.{{ .Context.ingress.suffix }}
schema:
  parameters:
    properties:
      memoryGi: { type: number, default: 1, multipleOf: 0.25, title: "Notebooks | Memory (GiB) | | order:2 columns:2", description: "Notebook (singleuser) pod memory (GiB) for requests/limits." }
      cpu:      { type: number, default: 0.5, multipleOf: 0.25, title: "Notebooks | CPU (vCPU) | | order:1 columns:2", description: "Notebook (singleuser) pod CPU (vCPU) for requests/limits." }
      # The S3 store backing the jupyter-fs file browser.
      storage: { type: connectionRef, contract: s3, required: true, title: "Storage | Object store | | order:1" }
      # This consumer's own S3 identity. Secret with keys: accessKey, secretKey.
      s3SecretRef: { type: string, required: true, title: "Storage | S3 credentials secret | | order:2" }
      # OAuth client Secret (client_id, client_secret, JUPYTERHUB_CRYPT_KEY).
      # Required in existing provisioning mode, generated in kubauth mode.
      oidcRoleMapping:
        type: object
        title: "Authentication | Role mapping | | order:3 advanced:true"
        description: "Optional GenericOAuthenticator overrides (claim_groups_key, allowed_groups, admin_groups, ...)"
        properties: {}
        additionalProperties: true
      fileBrowserLocations:
        type: array
        title: "Storage | File browser locations | | order:3 advanced:true"
        description: "jupyter-fs file browser locations (display name + s3 uri)"
        items:
          properties:
            name: { type: string, required: true }
            uri: { type: string, required: true }
      welcomeNotebook: { type: string, default: "", title: "Notebooks | Welcome notebook | textarea | order:4 advanced:true", description: "Welcome.ipynb content copied into each user home" }
      # PySpark connections: each item carries its final spark conf lines
      # (properties) and optionally its own S3 identity (keys accessKey/secretKey).
      # pyspark lists the connection names to enable.
      connections:
        type: array
        title: "Spark | Connections | | order:2 advanced:true"
        items:
          properties:
            name: { type: string, required: true }
            properties: { type: string }
            s3SecretRef: { type: string }
      pyspark:
        type: array
        title: "Spark | Enabled connections | | order:1 advanced:true"
        description: "Names of the connections below to wire into the PySpark kernel. Empty leaves the kernel without S3A or catalog settings."
        items: { type: string }
      sparkDefaults:
        title: "Spark | Conf defaults | | order:4 advanced:true"
        type: object
        description: "Spark conf defaults injected into PYSPARK_SUBMIT_ARGS (final values)"
        properties: {}
        additionalProperties: true
  context:
    properties:
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            properties:
              name: { type: string, required: true }
      ingress:
        required: true
        properties:
          suffix: { type: string, required: true }
          className: { type: string, required: true }
      storageClass:
        required: true
        properties:
          workspace: { type: string, required: true }
      oidc:
        required: true
        properties:
          authUrl: { type: string, required: true }
          tokenUrl: { type: string, required: true }
          userinfoUrl: { type: string, required: true }
          displayName: { type: string, default: keycloak }
          # Who makes the OAuth client. In the kubauth mode this package
          # generates it, in the existing one it is handed a Secret name.
          clientProvisioning: { type: string, default: existing }
          kubauth:
            properties:
              namespace: { type: string }
modules:
  # Active only when the platform says kubauth makes the clients.
  - name: oidc-client
    enabled: "{{ eq (.Context.oidc.clientProvisioning | default \"existing\") \"kubauth\" }}"
    source:
      local:
        path: ../../../charts/oidc-client
    values: |
      {{- $client := printf "%s-%s" .Release.metadata.name .Release.spec.targetNamespace }}
      {{- $hubUrl := printf "https://jupyterhub-%s.%s" .Release.spec.targetNamespace .Context.ingress.suffix }}
      # The clients live in one shared namespace, so the name carries the
      # project namespace: two same-named Releases would share a client.
      clientName: "{{ $client }}"
      oidcNamespace: "{{ (.Context.oidc.kubauth | default dict).namespace }}"
      credentialsSecretName: "{{ $client }}-oidc-creds"
      # Encrypts JupyterHub auth state.
      extraGeneratedKeys:
        - JUPYTERHUB_CRYPT_KEY
      redirectURIs:
        - "{{ $hubUrl }}/hub/oauth_callback"
      displayName: "JupyterHub ({{ .Release.metadata.name }})"
      description: "OIDC client for JupyterHub {{ .Release.metadata.name }} in {{ .Release.spec.targetNamespace }}"

  - name: spark-rbac
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/spark-rbac
        tag: 1.0.1
    values: |
      rbac:
        create: true
      serviceAccount:
        create: true
        name: "spark"
        automount: true

  - name: main
    dependsOn:
      - spark-rbac
    timeout: 10m
    source:
      helmRepository:
        url: https://hub.jupyter.org/helm-chart/
        chart: jupyterhub
        version: 4.3.3
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $domain := printf "%v" .Context.ingress.suffix -}}

      {{- $oidcRoleMapping := .Parameters.oidcRoleMapping | default dict -}}

      {{- $oidcName := .Context.oidc.displayName | default "keycloak" -}}

      {{- $oidcAuthUrl := .Context.oidc.authUrl -}}

      {{- $oidcTokenUrl := .Context.oidc.tokenUrl -}}

      {{- $oidcUserInfoUrl := .Context.oidc.userinfoUrl -}}

      {{- $storageApiUrl := .Parameters.storage.apiUrl -}}

      {{- $jupyterUrl := printf "https://jupyterhub-%s.%s" $namespace $domain -}}
      {{- $jupyterHost := regexReplaceAll "^https?://" $jupyterUrl "" -}}
      {{- $welcomeNotebook := (.Parameters.welcomeNotebook | default "") -}}
      {{- $welcomeNotebook = $welcomeNotebook
            | replace "{{ $jupyterUrl }}" $jupyterUrl
            | replace "{{ .Context.jupyterHub.endpoints.url }}" $jupyterUrl
            | replace "{{ .Release.namespace }}" $namespace
            | replace "{{ .Release.metadata.name }}" $release
            | replace "{{ .Context.ingress.suffix }}" $domain -}}
      {{- $jupyterConnections := (.Parameters.connections | default list) -}}
      {{- if not (kindIs "slice" $jupyterConnections) }}
        {{- fail "parameters.connections must be a list" -}}
      {{- end }}
      {{- $jupyterPySparkConnections := (.Parameters.pyspark | default list) -}}
      {{- if not (kindIs "slice" $jupyterPySparkConnections) }}
        {{- fail "parameters.pyspark must be a list" -}}
      {{- end }}
      {{- $sparkDefaults := (.Parameters.sparkDefaults | default dict) -}}
      {{- if not (kindIs "map" $sparkDefaults) }}
        {{- fail "parameters.sparkDefaults must be a map" -}}
      {{- end }}
      {{- $sparkDefaultKeys := (keys $sparkDefaults | sortAlpha) -}}
      {{- $jupyterConnectionsByName := dict -}}
      {{- range $connection := $jupyterConnections }}
        {{- if not (and $connection $connection.name) }}
          {{- fail "each item in parameters.connections must define name" -}}
        {{- end }}
        {{- $_ := set $jupyterConnectionsByName $connection.name $connection -}}
      {{- end }}

      {{/* The credentials Secret is the one named by the parameter when
           somebody else made the client, and the one this package generated
           when kubauth provisions it. Same keys either way, so everything
           below reads it the same. */}}
      {{- $oidcSecret := printf "creds-%s-oauth2" .Release.metadata.name -}}
      {{- if eq (.Context.oidc.clientProvisioning | default "existing") "kubauth" -}}
        {{- $oidcSecret = printf "%s-%s-oidc-creds" .Release.metadata.name .Release.spec.targetNamespace -}}
      {{- end }}
      # Fix resource naming conflicts by using release name as prefix
      fullnameOverride: "{{ .Release.metadata.name }}"
      nameOverride: "{{ .Release.metadata.name }}"

      hub:
        resources:
          requests:
            cpu: "0.1"
            memory: "0.5Gi"
          limits:
            cpu: "1"
            memory: "1Gi"
        extraEnv:
          OAUTH_CLIENT_ID:
            valueFrom:
              secretKeyRef:
                name: {{ $oidcSecret }}
                key: client_id
          OAUTH_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: {{ $oidcSecret }}
                key: client_secret
          JUPYTERHUB_CRYPT_KEY:
            valueFrom:
              secretKeyRef:
                name: {{ $oidcSecret }}
                key: JUPYTERHUB_CRYPT_KEY
        config:
          # https://oauthenticator.readthedocs.io/en/latest/how-to/refresh.html
          JupyterHub:
            hub_connect_url: "http://{{ $release }}-hub.{{ $namespace }}.svc.cluster.local:8081"
            authenticator_class: generic-oauth
            load_roles:
              - name: user
                scopes:
                  - self
                  - admin:auth_state!user
              - name: server
                scopes:
                  - users:activity!user
                  - access:servers!server
                  - admin:auth_state!user
          Authenticator:
            auto_login: true
            enable_auth_state: true
            auth_refresh_age: 300
            refresh_pre_spawn: true
          GenericOAuthenticator:
            login_service: {{ $oidcName }}
            oauth_callback_url: {{ $jupyterUrl }}/hub/oauth_callback
            authorize_url: {{ $oidcAuthUrl }}
            token_url: {{ $oidcTokenUrl }}
            userdata_url: {{ $oidcUserInfoUrl }}
            validate_server_cert: false
            claim_groups_key: groups
            manage_groups: true
            userdata_params:
              state: state
            {{- if gt (len $oidcRoleMapping) 0 }}
            {{- toYaml $oidcRoleMapping | nindent 6 }}
            {{- end }}
            username_key: preferred_username
            scope:
            - openid
            - profile
            - email
            - groups
        networkPolicy:
          enabled: false
        extraConfig:
          extraConfig01.py: |
            c.KubeSpawner.delete_grace_period = 120
            c.ServerApp.allow_root = True
        image:
          pullPolicy: Always
          pullSecrets: []
          name: quay.io/jupyterhub/k8s-hub
          tag: "4.3.3"
        db:
          type: sqlite-pvc
          pvc:
            storage: 1Gi
            storageClassName: "{{ .Context.storageClass.workspace }}"

      rbac:
        create: true

      cull:
        enabled: false

      proxy:
        service:
          type: ClusterIP
        chp:
          resources:
            requests:
              cpu: "0.1"
              memory: "0.125Gi"
            limits:
              cpu: "1"
              memory: "0.5Gi"

      ingress:
        enabled: true
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          # Notebook saves ship their embedded outputs: the nginx 1m default
          # rejects them with a 413.
          nginx.ingress.kubernetes.io/proxy-body-size: "64m"
          cert-manager.io/cluster-issuer: "{{ .Context.certificateIssuers.selfSigned.name }}"
        ingressClassName: {{ .Context.ingress.className }}
        hosts:
          - {{ $jupyterHost }}
        tls:
          - secretName: {{ .Release.metadata.name }}-tls
            hosts:
              - {{ $jupyterHost }}

      scheduling:
        userScheduler:
          enabled: false
        userPlaceholder:
          enabled: false

      singleuser:
        # Fix user pod naming conflicts by prefixing with release name
        podNameTemplate: "{{ .Release.metadata.name }}-{username}{servername}"

        image:
          name: quay.io/okdp/jupyter/all-spark-notebook
          tag: "spark-3.5.6-python-3.11-java-17-scala-2.12"

        startTimeout: 600

        extraEnv:
          NB_USER: "$(JUPYTERHUB_USER)"
          NB_UID: "1001"
          NB_GID: "100"
          CHOWN_HOME: "yes"
          CHOWN_HOME_OPTS: "-R"
          JUPYTER_ENABLE_LAB: "yes"
          EDITOR: "vim"
          GIT_SSL_NO_VERIFY: "false"
          # Ignore InsecureRequestWarning warnings
          PYTHONWARNINGS: "ignore:Unverified HTTPS request"
          # The Spark images ship pyspark under SPARK_HOME rather than in
          # site-packages: overriding PYTHONPATH outright hides it, and the
          # PySpark kernel then fails on "No module named pyspark".
          PYTHONPATH: "/etc/jupyter/auth:/usr/local/spark/python:/usr/local/spark/python/lib/py4j-0.10.9.7-src.zip"
          AWS_CA_BUNDLE: /cacerts/ca.crt
          REQUESTS_CA_BUNDLE: /cacerts/ca.crt
          CURL_CA_BUNDLE: /cacerts/ca.crt
          SSL_CERT_FILE: /cacerts/ca.crt
          TRUSTSTORE_PASSWORD: ""

          # https://github.com/jpmorganchase/jupyter-fs
          FS_S3_ENDPOINT_URL: "{{ $storageApiUrl }}"
          FS_S3_ACCESS_KEY:
            valueFrom:
              secretKeyRef:
                name: "{{ .Parameters.s3SecretRef }}"
                key: "accessKey"
          FS_S3_SECRET_KEY:
            valueFrom:
              secretKeyRef:
                name: "{{ .Parameters.s3SecretRef }}"
                key: "secretKey"

          {{- range $connectionName := $jupyterPySparkConnections }}
          {{- $connection := index $jupyterConnectionsByName $connectionName -}}
          {{- if $connection }}
          {{- $connectionEnvPrefix := upper (replace "." "_" (replace "-" "_" $connectionName)) -}}
          {{- $connectionS3SecretRef := (dig "s3SecretRef" "" $connection) -}}
          {{- if $connectionS3SecretRef }}
          {{ printf "%s_S3_ACCESS_KEY" $connectionEnvPrefix }}:
            valueFrom:
              secretKeyRef:
                name: "{{ $connectionS3SecretRef }}"
                key: "accessKey"
          {{ printf "%s_S3_SECRET_KEY" $connectionEnvPrefix }}:
            valueFrom:
              secretKeyRef:
                name: "{{ $connectionS3SecretRef }}"
                key: "secretKey"
          {{- end }}
          {{- end }}
          {{- end }}

          # Notebook pod IP used by Spark driver (spark.driver.host) in client mode
          POD_IP:
            valueFrom:
              fieldRef:
                fieldPath: status.podIP

          {{- if .Context.proxy.httpProxy }}
          HTTP_PROXY: {{ .Context.proxy.httpProxy | quote }}
          {{- end }}
          {{- if .Context.proxy.httpsProxy }}
          HTTPS_PROXY: {{ .Context.proxy.httpsProxy | quote }}
          {{- end }}
          {{- if .Context.proxy.noProxy }}
          NO_PROXY: {{ .Context.proxy.noProxy | quote }}
          {{- end }}

        {{- if $welcomeNotebook }}
        lifecycleHooks:
          postStart:
            exec:
              command:
                - /bin/bash
                - -lc
                - |
                  set -e
                  HOME="/home/$JUPYTERHUB_USER"
                  if [ ! -f "$HOME/Welcome.ipynb" ]; then
                    cp /etc/jupyterhub/welcome/Welcome.ipynb "$HOME/Welcome.ipynb"
                  fi

        defaultUrl: "/lab/tree/Welcome.ipynb"
        {{- end }}

        extraFiles:
          {{- if and $welcomeNotebook }}
          welcome-notebook:
            mountPath: /etc/jupyterhub/welcome/Welcome.ipynb
            stringData: |
              {{- $welcomeNotebook | trim | nindent 14 }}
          {{- end }}

          jupyter_server_config_py:
            mountPath: /etc/jupyter/jupyter_server_config.py
            stringData: |
              c.ServerApp.contents_manager_class = "jupyterfs.MetaManager"
              c.ServerApp.jpserver_extensions = {"jupyterfs.extension": True}

              {{- $fileBrowserLocations := list }}
              {{- $locations := (.Parameters.fileBrowserLocations | default list) }}

              {{- range $location := $locations }}
              {{- $name := default "" $location.name }}
              {{- $uri := default "" $location.uri }}
              {{- if and $name $uri }}
              {{- $fileBrowserLocations = append $fileBrowserLocations (dict "name" $name "uri" $uri) }}
              {{- end }}
              {{- end }}

              file_browser_locations = {{ $fileBrowserLocations | toJson }}

              import os

              c.JupyterFs.resources = [{
                "name": loc["name"],
                "url": loc["uri"],
                "type": "fsspec",
                "defaultWritable": True,
                "use_listings_cache": False,
                "auth": "none",
                "kwargs": {
                  "key": os.environ["FS_S3_ACCESS_KEY"],
                  "secret": os.environ["FS_S3_SECRET_KEY"],
                  "client_kwargs": {
                    "endpoint_url": os.environ["FS_S3_ENDPOINT_URL"],
                    "verify": os.environ["AWS_CA_BUNDLE"],
                  },
                },
               }
               for loc in file_browser_locations
              ]

          notebook_oauth2:
            mountPath: /etc/jupyter/auth/sitecustomize.py
            stringData: |
              import builtins
              import os
              import requests

              def _fresh_access_token():
                hub_token = os.environ["JUPYTERHUB_API_TOKEN"]
                hub_api_url = os.environ["JUPYTERHUB_API_URL"]
                user = os.environ["JUPYTERHUB_USER"]

                r = requests.get(
                  f"{hub_api_url}/users/{user}",
                  headers={"Authorization": f"Bearer {hub_token}"},
                  timeout=10,
                )
                r.raise_for_status()

                data = r.json()
                auth_state = data.get("auth_state")
                if auth_state is None:
                  raise RuntimeError(f"auth_state is null for user {user}")
                token = auth_state.get("access_token")
                if not token:
                  raise RuntimeError(f"No access_token in auth_state. Keys: {list(auth_state.keys())}")
                return token

              def _current_user():
                user = os.environ.get("JUPYTERHUB_USER")
                if not user:
                  raise RuntimeError("JUPYTERHUB_USER is not set")
                return user

              builtins.access_token = _fresh_access_token
              builtins.me = _current_user

        cpu:
          limit: {{ mulf (float64 .Parameters.cpu) 2 }}
          guarantee: {{ .Parameters.cpu }}
        memory:
          limit: {{ mulf (float64 .Parameters.memoryGi) 2 }}G
          guarantee: {{ .Parameters.memoryGi }}G

        profileList:
          - display_name: "🪶 Minimal Python"
            description: "Lightweight image with only Python 3.12"
            kubespawner_override:
              image: quay.io/okdp/jupyter/minimal-notebook:python-3.12.12-hub-5.4.2-lab-4.5.0
              image_pull_policy: Always
          - display_name: "📊 Scientific Python"
            description: "Includes Git, Pandas, NumPy, S3 browser, and Trino SQL support."
            kubespawner_override:
              image: quay.io/okdp/jupyter/scipy-notebook:python-3.12.12-hub-5.4.2-lab-4.5.0
              image_pull_policy: Always
          - display_name: "📊 Data Science"
            description: "Includes Git, Pandas, NumPy, S3 browser, and Trino SQL support, Matplotlib, R, and Julia"
            kubespawner_override:
              image: quay.io/okdp/jupyter/datascience-notebook:python-3.12.12-hub-5.4.2-lab-4.5.0
              image_pull_policy: Always
          - display_name: "🔥 PySpark"
            description: "Apache Spark big data processing"
            default: true
            kubespawner_override:
              image_pull_policy: Always
              environment:
                # Platform defaults every notebook job inherits. A job overrides
                # them in its own SparkSession builder.
                PYSPARK_SUBMIT_ARGS: >-
                  --master k8s://https://kubernetes.default.svc.cluster.local
                  --conf spark.submit.deployMode=client
                  --conf spark.driver.host=$(POD_IP)
                  --conf spark.kubernetes.driverEnv.SPARK_USER=$(NB_USER)
                  --conf spark.executorEnv.SPARK_USER=$(NB_USER)
                  --conf spark.kubernetes.container.image=$(SPARK_EXECUTOR_IMAGE)
                  --conf spark.kubernetes.executor.secrets.certs-bundle=/cacerts
                  --conf "spark.driver.extraJavaOptions=-Djavax.net.ssl.trustStore=/cacerts/bundle.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword="
                  --conf "spark.executor.extraJavaOptions=-Djavax.net.ssl.trustStore=/cacerts/bundle.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword="
                  --conf spark.kubernetes.namespace={{ $namespace }}
                  --conf spark.eventLog.compress=true
                  --conf spark.eventLog.rolling.enabled=true
                  --conf spark.network.timeout=600
                  {{ range $key := $sparkDefaultKeys }}
                  --conf {{ printf "%s=%s" $key ((printf "%v" (index $sparkDefaults $key))
                    | replace "{{ .Release.namespace }}" $namespace
                    | replace "{{ .Release.metadata.name }}" $release
                    | replace "{{ .Context.ingress.suffix }}" $domain
                    | replace "NAMESPACE" $namespace) | quote }}
                  {{- end }}
                  --conf spark.kubernetes.authenticate.serviceAccountName=spark
                  {{- range $connectionName := $jupyterPySparkConnections }}
                  {{- $connection := index $jupyterConnectionsByName $connectionName -}}
                  {{- if $connection }}
                  {{- $connectionEnvPrefix := upper (replace "." "_" (replace "-" "_" $connectionName)) -}}
                  {{- $connectionProperties := ($connection.properties | default "") -}}
                  {{- $connectionS3SecretRef := (dig "s3SecretRef" "" $connection) -}}
                  {{- $connectionProperties = $connectionProperties
                        | replace "{{ connection.name }}" $connectionName -}}
                  {{- $connectionProperties = $connectionProperties
                        | replace "{{ storage.endpoints.api }}" $storageApiUrl
                        | replace "{{ storage.endpoints.apiUrl }}" $storageApiUrl
                        | replace "{{ storage.region }}" (printf "%v" $.Parameters.storage.region) -}}
                  {{- if $connectionS3SecretRef }}
                    {{- $connectionProperties = $connectionProperties
                          | replace "$(S3_ACCESS_KEY)" (printf "$(%s_S3_ACCESS_KEY)" $connectionEnvPrefix)
                          | replace "$(S3_SECRET_KEY)" (printf "$(%s_S3_SECRET_KEY)" $connectionEnvPrefix) -}}
                  {{- end }}
                  {{- $connectionProperties = $connectionProperties
                        | replace "{{ idp.endpoints.token }}" $oidcTokenUrl
                        | replace "{{ idp.endpoints.tokenUrl }}" $oidcTokenUrl -}}
                  {{- if $connectionProperties }}
                  {{- range $line := splitList "\n" $connectionProperties }}
                  {{- $line = trim $line -}}
                  {{- if $line }}
                  --conf {{ $line | quote }}
                  {{- end }}
                  {{- end }}
                  {{- end }}
                  {{- end }}
                  {{- end }}
                  pyspark-shell
            profile_options:
              image:
                display_name: "Select PySpark kernel version"
                choices:
                  spark344:
                    display_name: "PySpark 3.4.4 / Python 3.11"
                    kubespawner_override:
                      image: quay.io/okdp/jupyter/all-spark-notebook:spark-3.4.4-python-3.11-java-17-scala-2.12
                      image_pull_policy: Always
                      environment:
                        SPARK_EXECUTOR_IMAGE: quay.io/okdp/spark-py:spark-3.4.4-python-3.11-scala-2.12-java-17
                  spark356:
                    display_name: "PySpark 3.5.6 / Python 3.11"
                    default: true
                    kubespawner_override:
                      image: quay.io/okdp/jupyter/all-spark-notebook:spark-3.5.6-python-3.11-java-17-scala-2.12
                      image_pull_policy: Always
                      environment:
                        SPARK_EXECUTOR_IMAGE: quay.io/okdp/spark-py:spark-3.5.6-python-3.11-scala-2.12-java-17

        serviceAccountName: spark
        storage:
          homeMountPath: "/home/{username}"
          dynamic:
            storageClass: standard
            # Fix PVC naming conflicts by prefixing with release name
            pvcNameTemplate: "{{ .Release.metadata.name }}-claim-{username}{servername}"
            volumeNameTemplate: "{{ .Release.metadata.name }}-volume-{username}{servername}"
          type: dynamic
          extraVolumes:
            - name: cacerts
              secret:
                secretName: certs-bundle
          extraVolumeMounts:
            - name: cacerts
              mountPath: /cacerts
              readOnly: true
        cloudMetadata:
