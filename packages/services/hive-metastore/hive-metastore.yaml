# Consumes db (database-server) and storage (s3). Produces one hive
# Connection (output metastore).
apiVersion: v1alpha1
name: hive-metastore
tag: 1.0.0 # x-release-please-version
protected: false
description: |
  Hive Metastore is a centralized metadata repository for data lakes and big data analytics.
  Stores and manages table schemas, partition information, and data locations for engines like Apache Hive, Spark, and Trino.
  Enables consistent schema access across distributed storage systems such as HDFS and Amazon S3,
  providing the foundation for unified SQL-based querying over large-scale datasets.
usage:
  text: |
    Hive Metastore is a centralized metadata repository for data lakes and big data analytics.
schema:
  parameters:
    properties:
      memoryGi: { title: "Resources | Memory (GiB) | | order:2 columns:2", type: number, default: 0.5, multipleOf: 0.25, description: "Memory (GiB) used for Kubernetes requests/limits (recommended: request=limit)." }
      cpu: { title: "Resources | CPU (vCPU) | | order:1 columns:2", type: number, default: 0.5, multipleOf: 0.25, description: "CPU request in millicores (e.g., 500=0.5 vCPU, 1000=1 vCPU)." }
      db: { title: "Cluster | Metadata database | | order:1", type: connectionRef, contract: database-server, required: true, description: "Connection to the SQL database hosting the metastore schema." }
      storage: { title: "Storage | Object store | | order:1", type: connectionRef, contract: s3, required: true, description: "Connection to the S3-compatible object store hosting the warehouse." }
      s3SecretRef: { title: "Storage | S3 credentials secret | | order:2", type: string, required: true, description: "Secret with keys accessKey/secretKey, this consumer's own S3 identity." }
      warehouseBucket: { title: "Storage | Warehouse bucket | | order:3 columns:2", type: string, default: hive, description: "S3 bucket used as the warehouse directory." }
modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/hive-metastore
        tag: 1.4.0
    values: |
      replicaCount: 1
      image:
        repository: quay.io/okdp/hive-metastore
        tag: 4.0.1
        pullPolicy: IfNotPresent

      logLevel: INFO
      serviceName: {{ .Release.metadata.name }}

      db:
        driverRef: {{ .Parameters.db.driver }}
        driverName: {{ .Parameters.db.engine }}
        host: {{ .Parameters.db.host }}
        port: {{ .Parameters.db.port }}
        databaseName: {{ .Parameters.db.dbName }}
        user:
          name: ~
          password:
            secretName: {{ .Parameters.db.secretRef }}
            propertyName: password

      extraEnvRaw:
      - name: HIVEMS_USER
        valueFrom:
          secretKeyRef:
            name: {{ .Parameters.db.secretRef }}
            key: username
      - name: THRIFT_LISTENING_PORT
        value: "9083"

      cloud_storage: "s3"
      s3:
        url: {{ .Parameters.storage.apiUrl }}
        # Misleading issue on hive-metastore chart, warehouseDirectory is a bucket (prefix not available)
        warehouseDirectory: {{ .Parameters.warehouseBucket }}
        accessKey:
          secretName: {{ .Parameters.s3SecretRef }}
          propertyName: accessKey
        secretKey:
          secretName: {{ .Parameters.s3SecretRef }}
          propertyName: secretKey
      gcs:
        enabled: false

      resources:
        requests:
          cpu: "{{ .Parameters.cpu }}"
          memory: "{{ .Parameters.memoryGi }}Gi"
        limits:
          cpu: "{{ mulf (float64 .Parameters.cpu) 2 }}"
          memory: "{{ mulf (float64 .Parameters.memoryGi) 2 }}Gi"
outputs:
  - name: metastore
    contract: hive
    values:
      thriftUri: "thrift://{{ .Release.metadata.name }}.{{ .Release.spec.targetNamespace }}.svc.cluster.local:9083"
roles:
  - data-catalog
  - metastore-catalog
dependencies:
  - database-server
  - storage
