# Consumes one s3 Connection (storage). s3SecretRef and oidcClientSecretRef
# name this instance's own identities.
apiVersion: v1alpha1
name: spark-history-server
tag: 3.5.1-p08
protected: false
description: |
  Spark History Server - Monitoring and debugging interface for Apache Spark applications.
  Provides detailed execution metrics, job timelines, and performance insights for completed Spark jobs.
  Essential tool for optimizing Spark workloads and troubleshooting data processing pipelines.
usage:
  text: |
    Spark History Server provides a web UI for viewing completed Spark applications.
    Access the UI at https://spark-web-proxy-{{ .Release.spec.targetNamespace }}.{{ .Context.ingress.suffix }}
schema:
  parameters:
    properties:
      cpu: { type: number, default: 0.5, multipleOf: 0.25, title: "Sizing | CPU (vCPU) | | order:1 columns:2 advanced:true" }
      memoryGi: { type: number, default: 1, multipleOf: 0.25, title: "Sizing | Memory (GiB) | | order:2 columns:2 advanced:true" }
      storage: { title: "Storage | Event log store | | order:1", type: connectionRef, contract: s3, required: true, description: "Connection to the S3-compatible object store holding the Spark event logs." }
      s3SecretRef: { title: "Storage | S3 credentials secret | | order:2", type: string, required: true, description: "Secret with keys accessKey/secretKey, this consumer's own S3 identity." }
      roleMapping:
        title: "Authentication | Role mapping | | order:4 advanced:true"
        description: "OIDC group to Spark ACL mapping (keys admin_groups, history_admin_groups, modify_groups, view_groups)."
        properties:
          admin_groups: { type: array, items: { type: string } }
          history_admin_groups: { type: array, items: { type: string } }
          modify_groups: { type: array, items: { type: string } }
          view_groups: { type: array, items: { type: string } }
  context:
    properties:
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            properties:
              name: { type: string, required: true }
      ingress:
        required: true
        properties:
          suffix: { type: string, required: true }
          className: { type: string, required: true }
      oidc:
        required: true
        properties:
          issuerUri: { type: string, required: true }
          scope: { type: string, default: "openid profile email groups" }
          usePKCE: { type: boolean, default: true }
modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/spark-history-server
        tag: 1.0.0
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $domain := printf "%v" .Context.ingress.suffix -}}

      {{- $oidcIssuerUri := .Context.oidc.issuerUri -}}
      {{- $oidcEnabled := .Context.oidc.enabled | default false -}}
      {{- $oidcRoleMapping := .Parameters.roleMapping | default dict -}}
      {{- if not (kindIs "map" $oidcRoleMapping) }}
        {{- fail "parameters.roleMapping must be a map" -}}
      {{- end }}
      {{- $adminGroups := get $oidcRoleMapping "admin_groups" | default list -}}
      {{- $historyAdminGroups := get $oidcRoleMapping "history_admin_groups" | default list -}}
      {{- $modifyGroups := get $oidcRoleMapping "modify_groups" | default list -}}
      {{- $viewGroups := get $oidcRoleMapping "view_groups" | default list -}}

      {{- $storageApiUrl := .Parameters.storage.internalUrl | default .Parameters.storage.apiUrl -}}

      {{- $webProxyEndpointUrl := printf "https://%s-%s.%s" "spark-web-proxy" $namespace $domain -}}

      {{- $historyRedirectUri := $webProxyEndpointUrl -}}

      image:
        repository: quay.io/okdp/spark
        pullPolicy: IfNotPresent
        tag: "spark-3.5.6-scala-2.12-java-17"

      resources:
        limits:
          cpu: "{{ .Parameters.cpu }}"
          memory: "{{ .Parameters.memoryGi }}Gi"
        requests:
          cpu: "250m"
          memory: "512Mi"

      # The web proxy addresses the history server as <release>-main, so the chart
      # must not append its own name to it.
      fullnameOverride: {{ .Release.metadata.name }}-main

      config:
        spark.history.fs.logDirectory: s3a://spark-events/event-logs
        spark.hadoop.fs.s3a.endpoint: {{ $storageApiUrl }}
        spark.hadoop.fs.s3a.path.style.access: {{ .Parameters.storage.pathStyle | default false }}
        spark.history.fs.cleaner.enabled: true
        spark.history.fs.eventLog.rolling.maxFilesToRetain: 5
      {{- if $oidcEnabled }}
        spark.ui.filters: io.okdp.spark.authc.OidcAuthFilter
        spark.io.okdp.spark.authc.OidcAuthFilter.param.issuer-uri: {{ $oidcIssuerUri }}
        spark.io.okdp.spark.authc.OidcAuthFilter.param.redirect-uri: {{ $historyRedirectUri }}/home
        spark.io.okdp.spark.authc.OidcAuthFilter.param.scope: {{ printf "%s offline_access" (.Context.oidc.scope | default "openid profile email groups") | replace " " "+" }}
        spark.io.okdp.spark.authc.OidcAuthFilter.param.cookie-max-age-minutes: 480
        spark.io.okdp.spark.authc.OidcAuthFilter.param.cookie-cipher-secret-key: FC5E81345CED0E256DC42E410362FF6E
        spark.io.okdp.spark.authc.OidcAuthFilter.param.cookie-is-secure: true
        spark.io.okdp.spark.authc.OidcAuthFilter.param.use-pkce: {{ if hasKey .Context.oidc "usePKCE" }}{{ .Context.oidc.usePKCE }}{{ else }}true{{ end }}
        spark.history.ui.acls.enable: true
        spark.user.groups.mapping: io.okdp.spark.authz.OidcGroupMappingServiceProvider
      {{- end }}
      {{- if gt (len $adminGroups) 0 }}
        # spark.admin.acls.groups
        spark.admin.acls.groups: {{ $adminGroups | join "," | quote }}
      {{- end }}
      {{- if gt (len $historyAdminGroups) 0 }}
        # spark.history.ui.admin.acls.groups
        spark.history.ui.admin.acls.groups: {{ $historyAdminGroups | join "," | quote }}
      {{- end }}
      {{- if gt (len $modifyGroups) 0 }}
        # spark.modify.acls.groups
        spark.modify.acls.groups: {{ $modifyGroups | join "," | quote }}
      {{- end }}
      {{- if gt (len $viewGroups) 0 }}
        # spark.ui.view.acls.groups
        spark.ui.view.acls.groups: {{ $viewGroups | join "," | quote }}
      {{- end }}

      extraEnvs:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.s3SecretRef }}
              key: accessKey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.s3SecretRef }}
              key: secretKey
        # Disable Certificate Checking
        - name: SPARK_HISTORY_OPTS
          value: "-Dcom.amazonaws.sdk.disableCertChecking=true"
        - name: JAVA_TOOL_OPTIONS
          value: "-Djavax.net.ssl.trustStore=/cacerts/bundle.p12 -Djavax.net.ssl.trustStorePassword="
        - name: AUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ printf "creds-%s-oauth2" .Release.metadata.name }}
              key: client_id
        - name: AUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ printf "creds-%s-oauth2" .Release.metadata.name }}
              key: client_secret

      extraVolumes:
        - name: cacerts
          secret:
            secretName: certs-bundle

      extraVolumeMounts:
        - name: cacerts
          mountPath: /cacerts
  # TODO: Kubocd — Add conditional modules
  - name: proxy
    dependsOn:
      - main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/spark-web-proxy
        tag: 0.1.0
    values: |

      {{- $webProxyEndpointHost := printf "%s-%s.%s" "spark-web-proxy" .Release.spec.targetNamespace .Context.ingress.suffix -}}

      image:
        repository: quay.io/okdp/spark-web-proxy
        pullPolicy: IfNotPresent
        tag: "0.2.1"

      configuration:
        spark:
          history:
            service: {{ .Release.metadata.name }}-main.{{ .Release.spec.targetNamespace }}.svc.cluster.local
          ui:
            proxyBase: /sparkui
          jobNamespaces:
            - {{ .Release.spec.targetNamespace }}

      ingress:
        enabled: true
        className: {{ .Context.ingress.className }}
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          cert-manager.io/cluster-issuer: {{ .Context.certificateIssuers.selfSigned.name }}
        hosts:
          - host: {{ $webProxyEndpointHost }}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - {{ $webProxyEndpointHost }}
            secretName: {{ .Release.metadata.name }}-proxy-tls
roles:
  - spark
dependencies:
  - identity
  - storage
  - ingress
