apiVersion: v1alpha1
name: spark-operator
tag: 1.0.0 # x-release-please-version
protected: false
description: |
  Spark Operator 2.4.0 - Kubernetes operator for managing Apache Spark applications

  This package provides the Kubeflow Spark Operator which simplifies running Spark applications
  on Kubernetes using custom resources (SparkApplication CRD). It supports Spark 2.3+.
usage:
  text: |
    Spark Operator has been deployed successfully.

    The operator manages SparkApplication custom resources in configured namespaces.
    
    To submit a Spark application:
    1. Create a namespace for your Spark applications (e.g., spark-apps)
    2. Create a ServiceAccount with appropriate RBAC permissions
    3. Submit a SparkApplication manifest
    
    Example SparkApplication:
    ```yaml
    apiVersion: sparkoperator.k8s.io/v1beta2
    kind: SparkApplication
    metadata:
      name: spark-pi
      namespace: spark-apps
    spec:
      type: Scala
      mode: cluster
      image: "quay.io/okdp/spark-py:spark-3.5.6-python-3.11-scala-2.12-java-17"
      imagePullPolicy: Always
      mainClass: org.apache.spark.examples.SparkPi
      mainApplicationFile: "local:///opt/spark/examples/jars/spark-examples_2.12-3.5.6.jar"
      sparkVersion: "3.5.6"
      restartPolicy:
        type: Never
      driver:
        cores: 1
        coreLimit: "1200m"
        memory: "512m"
        serviceAccount: spark
      executor:
        cores: 1
        instances: 2
        memory: "512m"
    ```
    
    Monitor your application using:
    kubectl get sparkapplications -n spark-apps
    kubectl describe sparkapplication spark-pi -n spark-apps

schema:
  parameters:
    properties:
      controllerReplicas: { type: integer, default: 1, title: "Controller | Replicas | stepper | order:1" }
      controllerLogLevel: { type: string, default: "info", enum: ["debug", "info", "warn", "error"], title: "Controller | Log level | | order:2" }
      controllerWorkers: { type: integer, default: 10, title: "Controller | Workers | stepper | order:3 advanced:true" }
      jobNamespaces:
        type: array
        title: "Controller | Job namespaces | | order:4"
        items:
          type: string
        description: "List of namespaces where Spark jobs can run. If empty string is included, all namespaces will be allowed"
      metricsEnabled:
        title: "Monitoring | Enable metrics | | order:1"
        type: boolean
        default: true
        description: "Enable Prometheus metrics"
      podMonitorEnabled:
        title: "Monitoring | Create PodMonitor | | order:2 condition:metricsEnabled=true"
        type: boolean
        default: false
        description: "Create PodMonitor for metrics collection"
      webhookEnabled:
        title: "Controller | Admission webhook | | order:5 advanced:true"
        type: boolean
        default: true
        description: "Enable admission webhook for validation and mutation"
  context:
    properties: {}

modules:
  - name: noname
    timeout: 10m
    source:
      helmRepository:
        url: https://kubeflow.github.io/spark-operator
        chart: spark-operator
        version: 2.4.0
    values: |
      # Helm hook configuration
      hook:
        upgradeCrd: false

      # Prometheus metrics configuration
      prometheus:
        metrics:
          enable: {{ .Parameters.metricsEnabled }}
        podMonitor:
          create: {{ .Parameters.podMonitorEnabled }}

      # Controller RBAC
      controller:
        replicas: {{ .Parameters.controllerReplicas }}
        logLevel: "{{ .Parameters.controllerLogLevel }}"
        workers: {{ .Parameters.controllerWorkers }}
        rbac:
          create: true
        podSecurityContext:
          fsGroup: null

      # Webhook configuration
      webhook:
        enable: {{ .Parameters.webhookEnabled }}
        podSecurityContext:
          fsGroup: null

      # Spark application configuration
      spark:
        # List of namespaces where to run spark jobs
        # If empty string is included, all namespaces will be allowed
        # Make sure the namespaces already exist.
        jobNamespaces: {{ .Parameters.jobNamespaces | default (list) | toJson }}

        serviceAccount:
          # Specifies whether to create a service account for spark applications
          create: false

        rbac:
          # Specifies whether to create RBAC resources for spark applications
          create: false

roles:
  - sparkOperator
dependencies: []
